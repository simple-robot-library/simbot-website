name: Deploy documentation

on:
  push:
    branches:
      - master
      - docs/v4
    paths:
      - 'Writerside/**'
      - 'public/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# 两个分支始终发布同一份完整站点，串行执行以避免覆盖。
concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '5.x'
            ref: master
          - version: '4.x'
            ref: docs/v4
    uses: ./.github/workflows/build-documentation.yml
    with:
      ref: ${{ github.ref_name == matrix.ref && github.sha || matrix.ref }}
      version: ${{ matrix.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download current documentation
        uses: actions/download-artifact@v4
        with:
          name: site-5.x
          path: site

      - name: Download archived documentation
        uses: actions/download-artifact@v4
        with:
          name: site-4.x
          path: site/v4

      - name: Generate version switcher and check combined site
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          site = Path("site")
          versions = []
          for version, directory, url, current in [
              ("4.x", site / "v4", "/v4/", False),
              ("5.x", site, "/", True),
          ]:
              config = json.loads((directory / "config.json").read_text())
              assert config["productVersion"] == version, config["productVersion"]
              display = config["productVersionName"]
              assert display.startswith(version[0] + ".") and display != version, display
              assert (directory / "index.html").is_file(), directory
              versions.append({"version": display, "url": url, "isCurrent": current})
          (site / "help-versions.json").write_text(json.dumps(versions, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4

  publish-indexes:
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      # 同一索引的两次更新依次执行，保留各自的 product/version 范围。
      max-parallel: 1
      fail-fast: false
      matrix:
        version: ['5.x', '4.x']
    container:
      image: registry.jetbrains.team/p/writerside/builder/algolia-publisher:2.0.32-3
    env:
      DOC_VERSION: ${{ matrix.version }}
      ALGOLIA_APP_NAME: VLLZ4JZE8Z
      ALGOLIA_INDEX_NAME: doc
    steps:
      - name: Download checked search records
        uses: actions/download-artifact@v4
        with:
          name: search-${{ matrix.version }}
          path: search

      - name: Read built product and version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('search/config.json', 'utf8'));
            if (config.productVersion !== process.env.DOC_VERSION || config.productId !== 's4') {
              throw new Error('Search metadata does not match the documentation version');
            }
            core.exportVariable('CONFIG_JSON_PRODUCT', config.productId);
            core.exportVariable('CONFIG_JSON_VERSION', config.productVersion);

      - name: Publish version search records
        shell: bash
        env:
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_KEY }}
        run: |
          set -euo pipefail
          env "algolia-key=$ALGOLIA_KEY" java -jar /opt/builder/help-publication-agent.jar \
            update-index \
            --application-name "$ALGOLIA_APP_NAME" \
            --index-name "$ALGOLIA_INDEX_NAME" \
            --product "$CONFIG_JSON_PRODUCT" \
            --version "$CONFIG_JSON_VERSION" \
            --index-directory search/records/ \
            2>&1 | tee algolia-update-index-log.txt
