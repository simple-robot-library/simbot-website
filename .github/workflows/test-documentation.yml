name: Test documentation

on:
  pull_request:
    branches:
      - master
      - docs/v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '5.x'
            ref: master
          - version: '4.x'
            ref: docs/v4
    uses: ./.github/workflows/build-documentation.yml
    with:
      # PR 使用目标大版本的合并结果，另一版仍从维护分支构建。
      ref: ${{ (github.event_name == 'pull_request' && github.base_ref == matrix.ref || github.event_name == 'workflow_dispatch' && github.ref_name == matrix.ref) && github.ref || matrix.ref }}
      version: ${{ matrix.version }}
